name: 'Build wheel'
description: 'Build the Python wheels for release on all platforms'

inputs:
  cmake-args:
    description: 'The args for generating CMake project'
    required: true
  build-frontend:
    description: 'Build the frontend mlx package'
    required: false
    default: 'true'
  build-backend:
    description: 'Build the backend mlx-cpu/mlx-cuda/mlx-metal packages'
    required: false
    default: 'true'
  macos-target:
    description: 'The target macOS version to build for'
    required: false
    default: '26.2'
  arch-tag:
    description: 'Platform architecture tag'
    required: false
    default: |-
      ${{ case(runner.arch == 'x64', 'x86_64',
               runner.arch == 'x86', 'i686',
               runner.arch == 'arm', 'armv7l',
               runner.arch == 'arm64', 'aarch64',
               'unknown')
      }}

runs:
  using: 'composite'
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        echo "::group::Install dependencies"
        uv pip install 'build<=1.4.2' setuptools
        if ${{ runner.os == 'Linux' }} ; then
          uv pip install auditwheel patchelf
        fi
        mkdir -p wheelhouse
        echo "::endgroup::"

    - name: Build frontend package
      if: inputs.build-frontend == 'true'
      shell: bash
      env:
        CMAKE_ARGS: ${{ inputs.cmake-args }}
        MACOSX_DEPLOYMENT_TARGET: ${{ inputs.macos-target }}
      run: |
        echo "::group::Build frontend package"
        python setup.py clean --all
        MLX_BUILD_STAGE=1 python -m build -w
        echo "::endgroup::"

    - name: Post-process frontend package
      if: inputs.build-frontend == 'true'
      shell: bash
      run: |
        echo "::group::Post-process frontend package"
        if ${{ runner.os == 'Linux' }} ; then
          auditwheel repair dist/mlx-*.whl \
            --plat manylinux_2_35_${{ inputs.arch-tag }} \
            --exclude libmlx.so* \
            --only-plat
        else
          mv dist/mlx-*.whl wheelhouse/
        fi
        echo "::endgroup::"

    - name: Build backend package
      if: inputs.build-backend == 'true'
      shell: bash
      env:
        CMAKE_ARGS: ${{ inputs.cmake-args }}
        MACOSX_DEPLOYMENT_TARGET: ${{ inputs.macos-target }}
      run: |
        echo "::group::Build backend package"
        python setup.py clean --all
        MLX_BUILD_STAGE=2 python -m build -w
        python - <<'PY'
        import os
        import re
        import subprocess
        from email.parser import Parser
        from pathlib import Path
        from zipfile import ZipFile

        from packaging.requirements import Requirement
        from packaging.specifiers import SpecifierSet
        from packaging.utils import canonicalize_name

        wheels = list(Path("dist").glob("mlx_cuda_13-*.whl"))
        build_cuda = "MLX_BUILD_CUDA=ON" in os.environ.get("CMAKE_ARGS", "")
        if build_cuda:
            nvcc_version = subprocess.check_output(["nvcc", "--version"], text=True)
            match = re.search(r"release (\d+)", nvcc_version)
            if not match:
                raise RuntimeError(
                    f"Could not determine the CUDA version from: {nvcc_version}"
                )
            cuda_major = int(match.group(1))
        else:
            cuda_major = None

        if cuda_major == 13 and len(wheels) != 1:
            raise RuntimeError(f"Expected one CUDA 13 wheel, found: {wheels}")

        for wheel in wheels:
            with ZipFile(wheel) as archive:
                metadata_files = [
                    name for name in archive.namelist()
                    if name.endswith(".dist-info/METADATA")
                ]
                if len(metadata_files) != 1:
                    raise RuntimeError(
                        f"Expected one METADATA file in {wheel}, "
                        f"found: {metadata_files}"
                    )
                metadata = Parser().parsestr(
                    archive.read(metadata_files[0]).decode()
                )
            requirements = [
                Requirement(value)
                for value in metadata.get_all("Requires-Dist", [])
            ]
            runtime_requirements = [
                requirement
                for requirement in requirements
                if canonicalize_name(requirement.name)
                == "nvidia-cuda-runtime"
            ]
            if (
                len(runtime_requirements) != 1
                or runtime_requirements[0].specifier
                != SpecifierSet("==13.*")
                or runtime_requirements[0].marker is not None
                or runtime_requirements[0].extras
                or runtime_requirements[0].url is not None
            ):
                raise RuntimeError(
                    f"{wheel} is missing the CUDA 13 runtime dependency: "
                    f"{requirements}"
                )
        PY
        echo "::endgroup::"

    - name: Post-process backend package
      if: inputs.build-backend == 'true'
      shell: bash
      run: |
        echo "::group::Post-process backend package"
        if ${{ runner.os == 'Linux' }} ; then
          if [ -f dist/mlx_cpu*.whl ]; then
            auditwheel repair dist/mlx_cpu*.whl \
              --plat manylinux_2_35_${{ inputs.arch-tag }}
          fi
          if [ -f dist/mlx_cuda*.whl ]; then
            auditwheel repair dist/mlx_cuda*.whl \
              --plat manylinux_2_35_${{ inputs.arch-tag }} \
              --exclude libcublas* \
              --exclude libcuda* \
              --exclude libcudnn* \
              --exclude libcufft* \
              --exclude libnccl* \
              --exclude libnvrtc*
          fi
        else
          if [ -f dist/mlx_cpu*.whl ]; then
            mv dist/mlx_cpu*.whl wheelhouse/
          fi
          if [ -f dist/mlx_cuda*.whl ]; then
            mv dist/mlx_cuda*.whl wheelhouse/
          fi
          if [ -f dist/mlx_metal*.whl ]; then
            mv dist/mlx_metal*.whl wheelhouse/
          fi
        fi
        echo "::endgroup::"
