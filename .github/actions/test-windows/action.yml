name: 'Run tests'
description: 'Run Python and C++ tests on Windows'

runs:
  using: 'composite'
  steps:
    - name: Run Python tests - CPU
      shell: bash
      env:
        DEVICE: cpu
      run: uv run pytest --durations=10 -n 4 || uv run pytest --last-failed

    - name: Run CPP tests - CPU
      shell: bash
      env:
        DEVICE: cpu
      run: ./build/cpp/mlx/tests.exe -tce="*gguf*"
